<!-- Image service card. DYNAMIC: image, image_alt, title, summary, url. -->
<article class="rc-svc-card" data-item>
  <div class="rc-svc-card__media">
    <img src="{{image}}" alt="{{image_alt}}" width="1806" height="1050" loading="lazy" data-field-src="image" data-field-alt="image_alt">
  </div>
  <div class="rc-svc-card__body">
    <h2 class="rc-svc-card__title"><a class="stretched-link" href="{{url}}" data-field="title" data-field-href="url">{{title}}</a></h2>
    <p data-field="summary">{{summary}}</p>
    <span class="rc-svc-card__more" aria-hidden="true">Learn more <i class="bi bi-arrow-right"></i></span>
  </div>
</article>
