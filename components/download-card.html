<!-- Download card. DYNAMIC: file, title, subtitle. -->
<div class="col-md-6 rc-reveal" data-item>
  <a class="rc-download" href="{{file}}" download data-field-href="file">
    <span class="rc-download__icon"><i class="bi bi-file-earmark-arrow-down"></i></span>
    <span class="rc-download__text"><strong data-field="title">{{title}}</strong><small data-field="subtitle">{{subtitle}}</small></span>
    <span class="rc-download__cta">Download <i class="bi bi-arrow-down"></i></span>
  </a>
</div>
