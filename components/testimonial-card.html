<!-- Testimonial card. DYNAMIC: quote, author, role, optional avatar/initials. -->
<figure class="rc-quote m-0" data-item>
  <span class="rc-quote__mark" aria-hidden="true"><i class="bi bi-quote"></i></span>
  <blockquote class="m-0"><p data-field="quote">{{quote}}</p></blockquote>
  <figcaption class="rc-quote__author">
    <span class="rc-quote__avatar" aria-hidden="true" data-field="avatar_or_initials">{{initials}}</span>
    <span><strong data-field="author_name">{{author_name}}</strong><small data-field="author_role">{{author_role}}</small></span>
  </figcaption>
</figure>
