<!-- Icon service card. DYNAMIC: icon_class, title, description. -->
<article class="rc-service" data-item>
  <span class="rc-service__icon"><i class="{{icon_class}}" aria-hidden="true"></i></span>
  <h3 class="rc-service__title" data-field="title">{{title}}</h3>
  <p data-field="description">{{description}}</p>
</article>
