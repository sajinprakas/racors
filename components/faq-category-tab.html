<!-- FAQ category tab. DYNAMIC: id, title, active state. The first tab is active. -->
<button class="rc-faq-nav__btn {{active_class}}" id="faq-tab-{{id}}" type="button" role="tab" data-bs-toggle="tab" data-bs-target="#faq-pane-{{id}}" aria-controls="faq-pane-{{id}}" aria-selected="{{selected}}" data-field="title">{{title}}</button>
