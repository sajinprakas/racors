<!-- Page loader: hide or remove when the site opts out of the loading screen. -->
<div class="rc-preloader" id="rcPreloader" role="status" aria-live="polite">
  <div class="rc-preloader__inner">
    <span class="rc-preloader__logo-wrap" aria-hidden="true">
      <img src="assets/images/logo-white.png" alt="" width="186" height="59" class="rc-preloader__logo rc-preloader__logo--base">
      <img src="assets/images/logo-draw.svg" alt="" width="700" height="260" class="rc-preloader__logo rc-preloader__logo--draw">
      <img src="assets/images/logo-white.png" alt="" width="186" height="59" class="rc-preloader__logo rc-preloader__logo--finish">
    </span>
    <span class="visually-hidden">Loading…</span>
  </div>
</div>
