<!-- Image category tile. DYNAMIC: image, image_alt, title, url. -->
<a href="{{url}}" class="rc-tile" data-field-href="url">
  <img src="{{image}}" alt="{{image_alt}}" loading="lazy" data-field-src="image" data-field-alt="image_alt">
  <span class="rc-tile__label" data-field="title">{{title}}</span>
</a>
