<!-- Image tile for the gallery lightbox. DYNAMIC: image, caption, image_large. -->
<a class="rc-gtile" href="{{image_large}}" data-lightbox="gallery" data-type="image" data-caption="{{caption}}" data-field-href="image_large" data-field-data-caption="caption">
  <img src="{{thumbnail}}" alt="{{caption}}" width="1000" height="1000" loading="lazy" data-field-src="thumbnail" data-field-alt="caption">
  <span class="rc-gtile__zoom" aria-hidden="true"><i class="bi bi-arrows-angle-expand"></i></span>
</a>
