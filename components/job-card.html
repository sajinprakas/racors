<!-- Job listing row. DYNAMIC: title, experience, application_url. -->
<li class="rc-job" data-item>
  <span class="rc-job__title" data-field="title">{{title}}</span>
  <span class="rc-job__exp" data-field="experience">{{experience}}</span>
  <button type="button" class="rc-job__apply" data-bs-toggle="modal" data-bs-target="#applyModal" data-job="{{title}}">Apply Now <i class="bi bi-arrow-right" aria-hidden="true"></i></button>
</li>
